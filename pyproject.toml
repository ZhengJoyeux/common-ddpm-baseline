[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sers-unconditional-ddpm"
version = "0.1.0"
description = "Unconditional one-dimensional DDPM for preprocessed SERS spectra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "einops>=0.8",
    "accelerate>=1.0",
    "ema-pytorch>=0.7",
    "denoising-diffusion-pytorch==2.2.6",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]