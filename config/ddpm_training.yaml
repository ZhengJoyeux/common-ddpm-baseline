project:
  name: d3_4_peak_parameter_physics_d2_6_2000step_s001
  random_seed: 2026
diagnostic_overfit:
  enabled: false
  spectrum_index: 0
  repeat_count: 50
data:
  input_directory: data/input/S001
  recursive: false
  allowed_extensions:
  - .xlsx
  - .xls
  - .csv
  sheet_name: 0
  header_row: null
  raman_shift_column: 0
  intensity_start_column: 1
  require_same_raman_shift_axis: false
  raman_shift_tolerance: 1.0e-06
  raman_range_tolerance: 1.0
  original_spectrum_length: auto
  model_spectrum_length: auto
  length_adaptation: raman_axis_interpolation
  padding_mode: right_zero_padding
  padding_value: 0.0
  split_unit: spectrum
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  shuffle: true
normalization:
  enabled: true
  method: global_minmax
  fit_on: train_only
  target_min: -1.0
  target_max: 1.0
  clip: false
  epsilon: 1.0e-12
  save_in_checkpoint: true
prior_residual:
  enabled: true
  prior_method: pca_reconstruction
  pca_explained_variance_ratio: 0.95
  pca_max_components: 6
  pca_sampling_strategy: independent_truncated_gaussian_scores
  pca_score_clip_standard_deviations: 2.5
  residual_normalization: robust_asinh
  residual_quantile: 99.5
  target_abs_max: 1.0
  epsilon: 1.0e-08
  mad_scale_factor: 1.4826
  pointwise_scale_floor_quantile: 10.0
broad_local_residual:
  enabled: true
  broad_filter:
    method: gaussian
    sigma_cm1: 7.0
    truncate: 4.0
  broad_prior:
    method: pca
    pca_explained_variance_ratio: 0.95
    pca_max_components: 6
    sampling_strategy: independent_truncated_gaussian_scores
    score_clip_standard_deviations: 2.5
  local_normalization:
    method: robust_asinh
    residual_quantile: 99.5
    target_abs_max: 1.0
  epsilon: 1.0e-08
physics_constraints:
  enabled: false
peak_derivative_constraints:
  enabled: false
  reference_baseline_sigma_cm1: 30.0
  reference_peak_smoothing_sigma_cm1: 2.0
  minimum_relative_prominence: 0.06
  minimum_peak_distance_cm1: 12.0
  maximum_peak_count: 10
  edge_exclusion_cm1: 24.0
  peak_core_half_width_cm1: 18.0
  transition_width_cm1: 6.0
  derivative_scale_quantile: 95.0
  minimum_derivative_scale: 0.0001
  smooth_l1_beta: 0.25
  timestep_weight_power: 1.0
  minimum_timestep_weight: 0.0
  total_weight: 1.0
  maximum_total_ratio_to_ddpm: 0.05
  numerical_safety_limit: 12.0
  epsilon: 1.0e-08
relative_peak_intensity_constraints:
  enabled: false
  reference_baseline_sigma_cm1: 30.0
  reference_peak_smoothing_sigma_cm1: 2.0
  minimum_relative_prominence: 0.06
  minimum_peak_distance_cm1: 12.0
  maximum_peak_count: 10
  minimum_peak_count: 2
  edge_exclusion_cm1: 24.0
  peak_half_width_cm1: 12.0
  baseline_inner_half_width_cm1: 18.0
  baseline_outer_half_width_cm1: 30.0
  minimum_relative_height_fraction: 0.03
  log_ratio_margin_iqr: 1.5
  minimum_log_ratio_width: 0.08
  smooth_l1_beta: 0.25
  timestep_weight_power: 1.0
  minimum_timestep_weight: 0.0
  total_weight: 1.0
  maximum_total_ratio_to_ddpm: 0.05
  numerical_safety_limit: 12.0
  epsilon: 1.0e-08
peak_parameter_constraints:
  enabled: true
  reference_baseline_sigma_cm1: 30.0
  reference_peak_smoothing_sigma_cm1: 2.0
  minimum_relative_prominence: 0.06
  minimum_peak_distance_cm1: 12.0
  maximum_peak_count: 10
  minimum_peak_count: 3
  edge_exclusion_cm1: 30.0
  maximum_measurement_half_window_cm1: 18.0
  minimum_measurement_half_window_cm1: 4.0
  neighbor_window_fraction: 0.45
  minimum_median_peak_height_fraction: 0.05
  softplus_temperature_fraction: 0.05
  minimum_softplus_temperature: 0.0001
  lower_quantile: 10.0
  upper_quantile: 90.0
  position_margin_mad: 0.5
  width_margin_mad: 0.5
  minimum_position_half_range_cm1: 1.0
  minimum_width_half_range_cm1: 1.0
  position_scale_cm1: 1.0
  width_scale_cm1: 2.0
  position_loss_weight: 1.0
  width_loss_weight: 0.5
  smooth_l1_beta: 0.5
  maximum_active_timestep_fraction: 0.5
  timestep_weight_power: 1.0
  minimum_timestep_weight: 0.0
  total_weight: 0.1
  maximum_total_ratio_to_ddpm: 0.02
  numerical_safety_limit: 12.0
  epsilon: 1.0e-08
diversity_constraints:
  enabled: false
feature_peak_residual_limiter:
  enabled: false
local_peak_distribution_constraints:
  enabled: false
model:
  channels: 1
  model_dimension: 16
  dimension_multipliers:
  - 1
  - 2
  - 4
  dropout: 0.0
  self_condition: false
  diffusion_timesteps: 100
  sampling_timesteps: 50
  objective: pred_x0
  beta_schedule: cosine
  ddim_sampling_eta: 0.0
  auto_normalize: false
diffusion:
  diffusion_steps: 100
  sampling_steps: 50
  objective: pred_x0
  beta_schedule: cosine
  ddim_sampling_eta: 0.0
  auto_normalize: false
  loss_weighting: uniform
  residual_aware_loss:
    enabled: false
training:
  device: cuda
  batch_size: 8
  number_of_epochs: 1000
  learning_rate: 0.0001
  weight_decay: 0.0
  number_of_workers: 0
  pin_memory: true
  drop_last: false
  validate_every_epochs: 500
  save_every_epochs: 500
  log_every_batches: 1
  gradient_accumulation_steps: 1
  maximum_gradient_norm: 1.0
  use_mixed_precision: false
  ema_decay: 0.995
  ema_update_every: 1
  maximum_validation_batches: 0
  validation_random_seed: 2026001
output:
  output_directory: outputs/experiments/d3_4_peak_parameter_physics_d2_6_2000step_s001
  checkpoint_directory: outputs/experiments/d3_4_peak_parameter_physics_d2_6_2000step_s001/checkpoints
  log_directory: outputs/experiments/d3_4_peak_parameter_physics_d2_6_2000step_s001/logs
  generated_spectrum_directory: outputs/experiments/d3_4_peak_parameter_physics_d2_6_2000step_s001/generated/ddim50_ema_no_sampling_calibration
  preview_plot_directory: outputs/experiments/d3_4_peak_parameter_physics_d2_6_2000step_s001/plots/ddim50_ema_no_sampling_calibration
  latest_checkpoint_name: latest.pt
  best_checkpoint_name: best.pt
  training_log_name: training_log.csv
  split_assignment_name: split_assignment.csv
generation:
  number_of_spectra: 100
  batch_size: 10
  model_source: ema
  crop_to_original_length: true
  inverse_normalize: true
  variation_scale: 1.0
  pca_score_clip_override_standard_deviations: null
  sampling_calibration:
    enabled: false
    non_peak_noise:
      enabled: false
      reference_smoothing_sigma_cm1: 30.0
      minimum_relative_prominence: 0.06
      minimum_peak_distance_cm1: 12.0
      maximum_peak_count: 20
      peak_protection_half_width_cm1: 24.0
      transition_width_cm1: 6.0
      fine_sigma_cm1: 1.5
      broad_sigma_cm1: 7.0
      broad_variation_scale: 0.46
      middle_component_scale: 0.55
      fine_component_scale: 0.85
    raman_shift_jitter:
      enabled: true
      distribution: truncated_normal
      standard_deviation_cm1: 1.2
      maximum_absolute_shift_cm1: 3.0
    peak_height_compression:
      enabled: true
      reference_smoothing_sigma_cm1: 30.0
      reference_peak_smoothing_sigma_cm1: 2.0
      minimum_relative_prominence: 0.06
      minimum_peak_distance_cm1: 12.0
      maximum_peak_count: 10
      peak_half_width_cm1: 12.0
      transition_width_cm1: 6.0
      height_variation_scale: 0.9
      minimum_batch_peak_median_height_fraction: 0.05
      minimum_valid_height: 1.0e-08
      minimum_factor: 0.65
      maximum_factor: 1.25
  training_guard:
    enabled: true
    reference_smoothing_sigma_cm1: 30.0
    minimum_relative_prominence: 0.06
    minimum_peak_distance_cm1: 12.0
    maximum_peak_count: 20
    metric_half_width_cm1: 24.0
    position_margin_cm1: 2.0
    bound_margin_iqr: 1.5
    minimum_valid_training_count: 8
    minimum_guard_peak_median_height_fraction: 0.05
    check_peak_position: true
    check_peak_height: true
    check_peak_width: true
    check_negative_minimum: true
    maximum_peak_violation_fraction: 0.2
  final_evaluation:
    random_seed: 2026
    pca_components: 6
    bootstrap_repeats: 500
    generated_pair_count: 50000
    broad_sigma_cm1: 7.0
  output_filename: generated_spectra.xlsx
  output_formats:
  - xlsx
  - csv
