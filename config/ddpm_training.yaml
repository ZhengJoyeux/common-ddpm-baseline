# ============================================================
# D0普通无条件一维DDPM：单条真实光谱重复过拟合诊断
#
# 目的：
# 检查模型、采样、归一化和拉曼轴恢复流程能否
# 记住一条固定的真实SERS光谱。
#
# 注意：
# 该模式不是正式的数据增强实验。
# 复制得到的validation/test不能评价模型泛化能力。
# ============================================================

project:
  name: sers_d2_prior_residual_pred_x0_robust_asinh_uniform_s001_24000
  random_seed: 2026

diagnostic_overfit:
  enabled: false

  # 0表示数据读取顺序中的第一条光谱。
  # 如需选择其他真实光谱，只修改这个索引。
  spectrum_index: 0

  # 复制50份后按照0.8/0.1/0.1分成40/5/5。
  repeat_count: 50

data:
  input_directory: data/input/S001
  recursive: false

  allowed_extensions:
    - .xlsx
    - .xls
    - .csv

  sheet_name: 0
  header_row: null   #有表头就换成 1 ，没有就换成null
  raman_shift_column: 0
  intensity_start_column: 1

  require_same_raman_shift_axis: false
  raman_shift_tolerance: 1.0e-6
  raman_range_tolerance: 1.0

  original_spectrum_length: auto
  model_spectrum_length: auto

  length_adaptation: raman_axis_interpolation
  padding_mode: right_zero_padding
  padding_value: 0.0

  # 正常模式仍然按源文件划分。
  # 诊断模式开启后，训练入口只在内存中
  # 临时修改为split_unit: spectrum。
  split_unit: source_file
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  shuffle: true

normalization:
  enabled: true
  method: global_minmax
  fit_on: train_only
  target_min: -1.0
  target_max: 1.0
  clip: false
  epsilon: 1.0e-12
  save_in_checkpoint: true

prior_residual:
  # D2先验残差模型开关。
  enabled: true

  # 只使用训练集计算逐点中位数先验。
  prior_method: training_pointwise_median

  # 使用可逆稳健分位数asinh残差变换。
  residual_normalization: robust_asinh

  # 使用训练残差绝对值的99.5%分位数
  # 表示正常残差的典型范围。
  residual_quantile: 99.5

  # 训练集最大绝对残差映射到1。
  target_abs_max: 1.0

  epsilon: 1.0e-8

model:
  channels: 1
  model_dimension: 16

  dimension_multipliers:
    - 1
    - 2
    - 4

  dropout: 0.0
  self_condition: false

  # 保留兼容字段。
  # 实际扩散参数由下面的diffusion区段读取。
  diffusion_timesteps: 100
  sampling_timesteps: 100
  objective: pred_x0
  beta_schedule: cosine
  ddim_sampling_eta: 0.0
  auto_normalize: false

diffusion:
  diffusion_steps: 100
  sampling_steps: 50
  objective: pred_x0
  beta_schedule: cosine
  ddim_sampling_eta: 0.0

  # 已经在项目外部缩放到[-1, 1]，
  # 必须关闭库内部的再次归一化。
  auto_normalize: false

  # D2-B：所有扩散时间步使用相同损失权重。
  loss_weighting: uniform

training:
  device: cuda
  batch_size: 8

  # 40条训练副本，batch_size为8，
  # 因此每个epoch为5个step。
  # 1000个epoch共5000个step。
  number_of_epochs: 4000

  learning_rate: 0.0001
  weight_decay: 0.0

  number_of_workers: 0
  pin_memory: true
  drop_last: false

  validate_every_epochs: 10
  save_every_epochs: 100
  log_every_batches: 10

  gradient_accumulation_steps: 1
  maximum_gradient_norm: 1.0
  use_mixed_precision: false

  ema_decay: 0.995
  ema_update_every: 1
  maximum_validation_batches: 0

output:
  output_directory: outputs/experiments/d2_prior_residual_pred_x0_robust_asinh_uniform_s001_24000
  checkpoint_directory: outputs/experiments/d2_prior_residual_pred_x0_robust_asinh_uniform_s001_24000/checkpoints
  log_directory: outputs/experiments/d2_prior_residual_pred_x0_robust_asinh_uniform_s001_24000/logs
  generated_spectrum_directory: outputs/experiments/d2_prior_residual_pred_x0_robust_asinh_uniform_s001_24000/generated/ddim50_ema
  preview_plot_directory: outputs/experiments/d2_prior_residual_pred_x0_robust_asinh_uniform_s001_24000/plots

  latest_checkpoint_name: latest.pt
  best_checkpoint_name: best.pt
  training_log_name: training_log.csv
  split_assignment_name: split_assignment.csv

generation:
  number_of_spectra: 20
  batch_size: 10

  # 可以被命令行中的
  # --model-source raw或ema覆盖。
  model_source: raw

  crop_to_original_length: true
  inverse_normalize: true
  output_filename: generated_spectra.xlsx

  output_formats:
    - xlsx
    - csv