project:
  name: sers_d3_local_peak_distribution_s001_2400
  random_seed: 2026
diagnostic_overfit:
  enabled: false
  spectrum_index: 0
  repeat_count: 50
data:
  input_directory: data/input/S001
  recursive: false
  allowed_extensions:
  - .xlsx
  - .xls
  - .csv
  sheet_name: 0
  header_row: null
  raman_shift_column: 0
  intensity_start_column: 1
  require_same_raman_shift_axis: false
  raman_shift_tolerance: 1.0e-06
  raman_range_tolerance: 1.0
  original_spectrum_length: auto
  model_spectrum_length: auto
  length_adaptation: raman_axis_interpolation
  padding_mode: right_zero_padding
  padding_value: 0.0
  split_unit: spectrum
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  shuffle: true
normalization:
  enabled: true
  method: global_minmax
  fit_on: train_only
  target_min: -1.0
  target_max: 1.0
  clip: false
  epsilon: 1.0e-12
  save_in_checkpoint: true
prior_residual:
  enabled: true
  prior_method: training_pointwise_median
  residual_normalization: pointwise_mad_asinh
  residual_quantile: 99.5
  mad_scale_factor: 1.4826
  pointwise_scale_floor_quantile: 10.0
  target_abs_max: 1.0
  epsilon: 1.0e-08
physics_constraints:
  enabled: true
  strategy: target_adaptive_peak_morphology
  total_weight: 1.0e-06
  calculation_domain: restored_global_minmax_normalized_spectrum
  inverse_transform:
    numerical_safety_limit: 15.0
  timestep_weighting:
    mode: sqrt_alpha_cumprod
    minimum_weight: 0.0
    pathology_minimum_weight: 0.05
  peak_detection:
    smoothing_sigma_cm1: 2.0
    local_maximum_radius_cm1: 4.0
    prominence_radius_cm1: 12.0
    minimum_peak_separation_cm1: 10.0
    analysis_half_width_cm1: 20.0
    maximum_peaks_per_spectrum: 12
    minimum_relative_prominence: 0.08
    minimum_prominence_noise_multiplier: 4.0
    training_prominence_floor_quantile: 25.0
    minimum_absolute_prominence: 0.0001
    edge_exclusion_cm1: 24.0
    positive_softplus_temperature: 0.01
    epsilon: 1.0e-08
  peak_position:
    zero_penalty_tolerance_cm1: 5.0
    transition_width_cm1: 5.0
  peak_width:
    narrow_relative_tolerance: 0.3
    broad_relative_tolerance: 0.5
    absolute_tolerance_cm1: 1.5
    transition_fraction: 0.25
    narrow_penalty_multiplier: 2.5
    broad_penalty_multiplier: 0.5
  peak_sharpness:
    upper_relative_tolerance: 0.25
    transition_fraction: 0.2
  peak_presence:
    minimum_area_ratio: 0.45
    transition_fraction: 0.25
  local_shape:
    profile_tolerance: 0.1
    first_derivative_tolerance: 0.25
    second_derivative_tolerance: 0.3
    unimodality_tolerance: 0.05
    total_variation_tolerance: 0.2
    target_support_fraction: 0.08
    transition_fraction: 0.2
    profile_weight: 0.0
    first_derivative_weight: 0.0
    second_derivative_weight: 0.0
    unimodality_weight: 2.0
    total_variation_weight: 1.0
  training_peak_distribution:
    enabled: true
    maximum_reference_peaks: 10
    minimum_relative_prominence: 0.05
    training_prominence_floor_multiplier: 0.5
    analysis_half_width_cm1: 30.0
    maximum_absolute_shift_cm1: 5.0
    shift_transition_cm1: 1.0
    coherence_tolerance_cm1: 1.0
    coherence_transition_cm1: 0.5
    apex_softmax_temperature_fraction: 0.05
    height_lower_quantile: 5.0
    height_upper_quantile: 95.0
    height_mad_margin_multiplier: 0.5
    height_transition_fraction: 0.2
    width_lower_quantile: 5.0
    width_upper_quantile: 95.0
    width_mad_margin_multiplier: 0.75
    width_transition_fraction: 0.2
  negative_valley:
    enabled: false
    noise_margin_multiplier: 4.0
    minimum_margin_fraction: 0.02
    center_weight_sigma_fraction: 0.4
    transition_fraction: 0.2
    weight_within_extreme: 2.0
  pathology_aggregation:
    mean_weight: 0.2
    topk_weight: 0.8
    topk_fraction: 0.01
  roughness:
    first_derivative_quantile: 99.5
    second_derivative_quantile: 99.5
    limit_multiplier: 1.15
    first_transition_fraction: 0.2
    second_transition_fraction: 0.2
    first_derivative_weight: 1.0
    second_derivative_weight: 1.5
  pointwise_envelope:
    enabled: true
    lower_quantile: 20.0
    upper_quantile: 100.0
    mad_margin_multiplier: 1.0
    transition_fraction: 0.2
  extreme_intensity:
    lower_margin_fraction: 0.02
    upper_margin_fraction: 0.02
    transition_fraction: 0.08
  scaled_residual_guard:
    enabled: false
    absolute_quantile: 99.5
    limit_multiplier: 1.05
    transition_fraction: 0.15
  component_weights:
    position: 0.0
    width: 0.0
    sharpness: 0.0
    presence: 0.0
    local_shape: 0.0
    stable_peak_shift: 1.0e-12
    stable_peak_coherence: 0.0
    stable_peak_height: 0.0
    stable_peak_width: 0.0
    roughness: 0.0
    extreme: 1.0
    scaled_residual_guard: 0.0
diversity_constraints:
  enabled: false
  strategy: low_noise_pairwise_residual_geometry
  total_weight: 0.01
  epsilon: 1.0e-08
  low_noise_gate:
    minimum_alpha_cumprod: 0.5
    minimum_samples: 4
  high_frequency_filter:
    smoothing_sigma_points: 1.0
    kernel_truncate: 3.0
    distance_reference_quantile: 50.0
    correlation_reference_quantile: 90.0
  pairwise_distance:
    enabled: true
    metric: whitened_l2
    minimum_distance_ratio: 0.5
    maximum_distance_ratio: 1.5
    transition_fraction: 0.2
    weight: 1.0
  pairwise_correlation:
    enabled: true
    maximum_excess_correlation: 0.01
    transition_fraction: 0.2
    weight: 0.5
  pointwise_variance_floor:
    enabled: true
    active_std_quantile: 20.0
    minimum_std_ratio: 0.25
    maximum_std_ratio: 1.4
    reference_std_floor_fraction: 0.25
    weight: 0.2
  peak_morphology:
    enabled: false
    weight: 1.0
feature_peak_residual_limiter:
  enabled: false
model:
  channels: 1
  model_dimension: 16
  dimension_multipliers:
  - 1
  - 2
  - 4
  dropout: 0.0
  self_condition: false
  diffusion_timesteps: 100
  sampling_timesteps: 50
  objective: pred_x0
  beta_schedule: cosine
  ddim_sampling_eta: 0.0
  auto_normalize: false
diffusion:
  diffusion_steps: 100
  sampling_steps: 50
  objective: pred_x0
  beta_schedule: cosine
  ddim_sampling_eta: 0.0
  auto_normalize: false
  loss_weighting: uniform
  residual_aware_loss:
    enabled: false
    reference_quantile: 0.9
    strength: 2.0
    power: 1.0
    maximum_relative_magnitude: 3.0
    minimum_reference_scale: 0.02
    normalize_per_sample: true
training:
  device: cuda
  batch_size: 8
  number_of_epochs: 1200
  learning_rate: 0.0001
  weight_decay: 0.0
  number_of_workers: 0
  pin_memory: true
  drop_last: false
  validate_every_epochs: 100
  save_every_epochs: 150
  log_every_batches: 1
  gradient_accumulation_steps: 1
  maximum_gradient_norm: 1.0
  use_mixed_precision: false
  ema_decay: 0.995
  ema_update_every: 1
  maximum_validation_batches: 0
  validation_random_seed: 2026001
output:
  output_directory: outputs/experiments/d3_local_peak_distribution_s001_2400
  checkpoint_directory: outputs/experiments/d3_local_peak_distribution_s001_2400/checkpoints
  log_directory: outputs/experiments/d3_local_peak_distribution_s001_2400/logs
  generated_spectrum_directory: outputs/experiments/d3_local_peak_distribution_s001_2400/generated/compare_step2400_latest_ddim50_ema
  preview_plot_directory: outputs/experiments/d3_local_peak_distribution_s001_2400/plots
  latest_checkpoint_name: latest.pt
  best_checkpoint_name: best.pt
  training_log_name: training_log.csv
  split_assignment_name: split_assignment.csv
generation:
  number_of_spectra: 100
  batch_size: 10
  model_source: ema
  crop_to_original_length: true
  inverse_normalize: true
  output_filename: generated_spectra.xlsx
  output_formats:
  - xlsx
  - csv
random:
  seed: 2026
  deterministic: false
local_peak_distribution_constraints:
  enabled: true
  epsilon: 1.0e-08
  numerical_safety_limit: 15.0
  minimum_batch_samples: 3
  maximum_total_ratio_to_ddpm: 0.2
  low_noise_gate:
    full_weight_max_timestep: 20
    zero_weight_min_timestep: 45
  stable_peak_filter:
    maximum_position_std_cm1: 2.0
    minimum_height_median: 0.05
  peak_window:
    edge_fraction: 0.12
    softplus_temperature_fraction: 0.01
  wing_shape_tracking:
    enabled: true
    weight: 0.0008
    lower_profile_fraction: 0.15
    upper_profile_fraction: 0.7
  negative_tail:
    enabled: true
    weight: 0.006
    transition_fraction: 0.03
    minimum_timestep_weight: 0.05
    mean_weight: 0.2
    topk_weight: 0.8
    topk_fraction: 0.01
  wing_dispersion:
    enabled: true
    weight: 0.0015
    lower_profile_fraction: 0.15
    upper_profile_fraction: 0.65
    minimum_reference_std: 0.01
    lower_std_ratio: 0.9
    upper_std_ratio: 1.15
  shift_dispersion:
    enabled: true
    weight: 0.0005
    minimum_reference_std_cm1: 0.25
    lower_std_ratio: 0.85
    upper_std_ratio: 1.2
  width_dispersion:
    enabled: true
    weight: 0.0005
    minimum_reference_std_cm1: 0.25
    lower_std_ratio: 0.85
    upper_std_ratio: 1.2
  height_cv_upper:
    enabled: true
    weight: 0.001
    minimum_reference_cv: 0.02
    upper_ratio: 1.05
